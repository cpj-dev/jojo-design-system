<!-- @dsCard group="Components" viewport="700x460" name="Core — buttons, badges, dots" subtitle="Pill actions, status chips, dots, avatars, kbd" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Core components</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin: 0; padding: 22px 24px; }
  .grid { display: flex; flex-direction: column; gap: 18px; }
  .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em; color: var(--fg-2); text-transform: uppercase; margin-bottom: 9px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton, Badge, Tag, StatusDot, Avatar, Kbd, Separator } = window.JojoDesignSystem;
  const I = (n) => <i data-lucide={n}></i>;

  function Demo() {
    return (
      <div className="grid">
        <div>
          <div className="lbl">Buttons — variants</div>
          <div className="row">
            <Button variant="primary">Download</Button>
            <Button variant="secondary">Documentation</Button>
            <Button variant="ghost">Cancel</Button>
            <Button variant="outline">Talk to sales</Button>
            <Button variant="tertiary">See pricing</Button>
            <Button variant="quinary">Skip</Button>
          </div>
        </div>

        <div>
          <div className="lbl">Sizes · with icon · disabled</div>
          <div className="row">
            <Button size="lg" variant="primary" leadingIcon={I('download')}>Get started</Button>
            <Button size="md" variant="secondary" leadingIcon={I('github')}>Sign in</Button>
            <Button size="sm" variant="ghost">Small</Button>
            <Button variant="primary" disabled>Disabled</Button>
          </div>
        </div>

        <div>
          <div className="lbl">Icon buttons</div>
          <div className="row">
            <IconButton icon={I('search')} label="Search" shape="trigger" />
            <IconButton icon={I('settings')} label="Settings" />
            <IconButton icon={I('bell')} label="Notifications" />
            <IconButton icon={I('sun')} label="Theme" size="sm" />
            <Separator orientation="vertical" />
            <span style={{ display: 'inline-flex', gap: 4 }}><Kbd>⌘</Kbd><Kbd>K</Kbd></span>
            <Kbd>Tab</Kbd>
          </div>
        </div>

        <div>
          <div className="lbl">Badges · tags (status lives in content)</div>
          <div className="row">
            <Badge>Beta</Badge>
            <Badge tone="ok">Passing</Badge>
            <Badge tone="info">Info</Badge>
            <Badge tone="warning">Queued</Badge>
            <Badge tone="danger">Failed</Badge>
            <Badge tone="neutral" mono>v0.42.3</Badge>
            <Separator orientation="vertical" />
            <Tag>TypeScript</Tag>
            <Tag leadingIcon={<StatusDot tone="ok" />}>production</Tag>
            <Tag onRemove={() => {}}>has:pr</Tag>
          </div>
        </div>

        <div>
          <div className="lbl">Status dots · avatars</div>
          <div className="row">
            <span className="row" style={{ gap: 6 }}><StatusDot tone="ok" /> Operational</span>
            <span className="row" style={{ gap: 6 }}><StatusDot tone="warning" /> Degraded</span>
            <span className="row" style={{ gap: 6 }}><StatusDot tone="danger" /> Down</span>
            <Separator orientation="vertical" />
            <Avatar initials="AL" size="sm" />
            <Avatar initials="CW" />
            <Avatar initials="JS" size="lg" />
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  requestAnimationFrame(() => window.lucide && window.lucide.createIcons());
</script>
</body>
</html>
