<!-- @dsCard group="Components" viewport="700x440" name="Data — table & tabs" subtitle="Divided table with selection + editor-style tabs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data components</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px 24px; }
  .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em; color: var(--fg-2); text-transform: uppercase; margin: 0 0 10px; }
  .nm { display: inline-flex; align-items: center; gap: 9px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Table, Tabs, Badge, StatusDot } = window.JojoDesignSystem;
  const { useState } = React;

  const ROWS = [
    { id: 'd1', name: 'web — main', env: 'Production', status: 'ok', commit: 'a1f9c2e', duration: '38s' },
    { id: 'd2', name: 'web — feat/predict', env: 'Preview', status: 'info', commit: '7b30d11', duration: '41s' },
    { id: 'd3', name: 'docs — main', env: 'Production', status: 'warning', commit: 'c0e4a88', duration: '1m 12s' },
    { id: 'd4', name: 'api — hotfix', env: 'Staging', status: 'danger', commit: '5d2bb90', duration: '—' },
  ];
  const TONE = { ok: 'Ready', info: 'Building', warning: 'Queued', danger: 'Failed' };

  function Demo() {
    const [tab, setTab] = useState('deployments');
    const [sel, setSel] = useState('d1');
    return (
      <div>
        <Tabs
          value={tab}
          onChange={setTab}
          tabs={[
            { id: 'deployments', label: 'Deployments' },
            { id: 'analytics', label: 'Analytics' },
            { id: 'logs', label: 'Logs' },
            { id: 'settings', label: 'Settings' },
          ]}
        />
        <div style={{ height: 18 }} />
        <div className="lbl">Click a row — selection is a tint + inset accent ring</div>
        <Table
          rowKey="id"
          selectedId={sel}
          onRowClick={(r) => setSel(r.id)}
          data={ROWS}
          columns={[
            { key: 'name', label: 'Deployment', render: (v) => <span className="nm" style={{ fontFamily: 'var(--font-mono)', fontSize: 12 }}>{v}</span> },
            { key: 'env', label: 'Environment' },
            { key: 'status', label: 'Status', render: (v) => <span className="nm"><StatusDot tone={v} /> {TONE[v]}</span> },
            { key: 'commit', label: 'Commit', render: (v) => <Badge mono>{v}</Badge> },
            { key: 'duration', label: 'Duration', numeric: true },
          ]}
        />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
