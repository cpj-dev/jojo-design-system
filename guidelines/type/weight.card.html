<!-- @dsCard group="Type" viewport="700x172" name="Weight & hierarchy" subtitle="The system runs at 400; 500 for some titles; 700 is rare" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 20px 22px; }
  .row { display: flex; gap: 28px; align-items: baseline; margin-bottom: 14px; }
  .w { font-family: var(--font-sans); font-size: 30px; color: var(--fg-1); letter-spacing: -0.5px; }
  .l { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-2); }
  .note { font-size: 13px; color: var(--fg-2); line-height: 1.5; border-top: 1px solid var(--hairline); padding-top: 12px; }
</style></head>
<body>
  <div class="row">
    <div class="w" style="font-weight:400;">Aa 400</div>
    <div class="w" style="font-weight:500;">Aa 500</div>
    <div class="w" style="font-weight:700;">Aa 700</div>
  </div>
  <div class="note">Base 400 · medium 500 for some titles · bold 700 is reserved for mid-size section heads only. Hierarchy comes from <strong style="font-weight:500;">size + negative tracking</strong>, not weight.</div>
</body></html>
