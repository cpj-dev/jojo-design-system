<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 20px 22px; }
  .lead { font-family: var(--font-serif); font-size: 22px; line-height: 1.4; color: var(--fg-1); max-width: 60ch; }
  .lead em { font-style: italic; }
  .tag { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-2); margin-top: 16px; }
</style></head>
<body>
  <p class="lead">The mechanism <em>is</em> the brand: one warm ink, mixed into one warm paper, at graded steps — and a single orange reserved for state.</p>
  <div class="tag">--font-serif · EB Garamond · lead paragraphs &amp; pull-quotes only</div>
</body></html>
