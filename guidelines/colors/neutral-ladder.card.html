<!-- @dsCard group="Colors" viewport="700x158" name="Surface tokens" subtitle="Background and surface aliases used by pages and components" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; }
  .row { display: flex; gap: 8px; }
  .sw { flex: 1; }
  .chip { height: 58px; border-radius: var(--radius); border: 1px solid var(--hairline); }
  .nm { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-2); margin-top: 8px; line-height: 1.35; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background: var(--bg-app);"></div><div class="nm">--bg-app<br/>page</div></div>
    <div class="sw"><div class="chip" style="background: var(--bg-1);"></div><div class="nm">--bg-1<br/>well</div></div>
    <div class="sw"><div class="chip" style="background: var(--bg-card);"></div><div class="nm">--bg-card<br/>card</div></div>
    <div class="sw"><div class="chip" style="background: var(--bg-2);"></div><div class="nm">--bg-2<br/>hover</div></div>
    <div class="sw"><div class="chip" style="background: var(--bg-3);"></div><div class="nm">--bg-3<br/>fill</div></div>
    <div class="sw"><div class="chip" style="background: var(--bg-4);"></div><div class="nm">--bg-4<br/>deepest</div></div>
  </div>
</body></html>
