<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 18px 22px; }
  .row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .box { background: var(--bg-3); border: 1px solid var(--hairline); border-radius: var(--radius); display: flex; align-items: center; padding: 0 14px; font-size: 13px; color: var(--fg-2); width: 230px; }
  .nm { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
</style></head>
<body>
  <div class="row"><div class="box" style="height: var(--row-h);">sidebar / nav row</div><span class="nm">--row-h · 29px</span></div>
  <div class="row"><div class="box" style="height: var(--trigger-h); border-radius: var(--radius-trigger);">search-as-trigger</div><span class="nm">--trigger-h · 36px</span></div>
  <div class="row"><div class="box" style="height: var(--input-h);">real input</div><span class="nm">--input-h · 44px</span></div>
</body></html>
