<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 18px 22px; }
  .row { display: flex; gap: 16px; align-items: stretch; }
  .panel { flex: 1; border-radius: var(--radius); display: flex; align-items: center; padding: 0 22px; min-height: 78px; }
  .on-bg { background: var(--bg-app); border: 1px solid var(--hairline); color: var(--fg-1); }
  .on-fill { background: var(--fill-ink); color: var(--fg-on-ink); }
  .note { font-size: 11.5px; color: var(--fg-2); margin-top: 13px; }
  .lockup { display: inline-flex; align-items: center; gap: 11px; }
  .lockup .wm { font-family: var(--font-sans); font-size: 22px; font-weight: 500; letter-spacing: -0.6px; }
</style></head>
<body>
  <div class="row">
    <div class="panel on-bg">
      <span class="lockup">
        <svg width="30" height="30" viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5" stroke="currentColor" stroke-opacity="0.18"/><circle cx="15.6" cy="8" r="2" fill="currentColor"/><path d="M15.6 12 V17.4 C15.6 20.3 13.4 21.7 10.8 21" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="wm">jojo</span>
      </span>
    </div>
    <div class="panel on-fill">
      <span class="lockup">
        <svg width="30" height="30" viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5" stroke="currentColor" stroke-opacity="0.3"/><circle cx="15.6" cy="8" r="2" fill="currentColor"/><path d="M15.6 12 V17.4 C15.6 20.3 13.4 21.7 10.8 21" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="wm">jojo</span>
      </span>
    </div>
  </div>
  <div class="note">The mark is a lowercase "j"; the wordmark sets "jojo" in the sans stack. Both inherit currentColor when inlined.</div>
</body></html>
