<!-- @dsCard group="Geometry" viewport="700x176" name="Border tokens" subtitle="Standard and higher-contrast 1px borders" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 18px 22px; }
  .row { display: flex; gap: 16px; }
  .card { flex: 1; background: var(--bg-card); border-radius: var(--radius); padding: 16px; }
  .title { font-size: 14px; color: var(--fg-1); }
  .sub { font-size: 12px; color: var(--fg-2); margin-top: 5px; line-height: 1.45; }
  .nm { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-2); margin-top: 12px; }
</style></head>
<body>
  <div class="row">
    <div class="card" style="border: 1px solid var(--hairline);">
      <div class="title">Standard border</div>
      <div class="sub">Dividers, table rows, tabs, inputs, and utility edges.</div>
      <div class="nm">1px · --hairline</div>
    </div>
    <div class="card" style="background: var(--bg-app); border: 1px solid var(--rule-ink);">
      <div class="title">Higher-contrast border</div>
      <div class="sub">Framed, selected, or higher-emphasis surfaces.</div>
      <div class="nm">1px · --rule-ink</div>
    </div>
  </div>
  <div style="font-size:11.5px;color:var(--fg-2);margin-top:14px;">All standard borders are 1px. Use color tokens instead of ad hoc border colors.</div>
</body></html>
