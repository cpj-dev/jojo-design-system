<!-- @dsCard group="Geometry" viewport="700x176" name="Motion" subtitle="Instant state changes and color/opacity transitions" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 18px 22px; }
  .row { display: flex; gap: 16px; }
  .tier { flex: 1; background: var(--bg-card); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 14px 16px; }
  .h { font-size: 14px; color: var(--fg-1); display: flex; align-items: baseline; justify-content: space-between; }
  .h .t { font-family: var(--font-mono); font-size: 11px; color: var(--accent-orange); }
  .d { font-size: 12.5px; color: var(--fg-2); margin-top: 7px; line-height: 1.5; }
  .note { font-size: 11.5px; color: var(--fg-2); margin-top: 13px; }
</style></head>
<body>
  <div class="row">
    <div class="tier">
      <div class="h">Instant <span class="t">0s</span></div>
      <div class="d">Buttons, nav, cards, and rows use immediate state changes.</div>
    </div>
    <div class="tier">
      <div class="h">Color <span class="t">≤200ms ease</span></div>
      <div class="d">Content-level color and opacity transitions for inputs and reveals.</div>
    </div>
  </div>
  <div class="note">Reveal panels may add a ≤6px translateY. A global guard honors prefers-reduced-motion.</div>
</body></html>
