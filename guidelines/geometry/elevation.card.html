<!-- @dsCard group="Geometry" viewport="700x178" name="Elevation — flat & matte" subtitle="Depth is the card ladder; the only shadow is the flyout halo" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; }
  .row { display: flex; gap: 22px; align-items: center; }
  .card { width: 180px; height: 88px; background: var(--bg-card); border: 1px solid var(--hairline); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--fg-2); }
  .flat { box-shadow: none; }
  .halo { box-shadow: var(--shadow-flyout); background: var(--bg-popover); }
  .nm { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-2); margin-top: 9px; text-align: center; }
  .col { display: flex; flex-direction: column; }
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="card flat">card at rest</div><div class="nm">box-shadow: none</div></div>
    <div class="col"><div class="card halo">flyout / popover</div><div class="nm">--shadow-flyout · matte halo</div></div>
    <div style="font-size:12px;color:var(--fg-2);max-width:200px;line-height:1.5;">No Material elevation, no glow, no offset drop shadows. Depth comes from the warm tint ladder.</div>
  </div>
</body></html>
