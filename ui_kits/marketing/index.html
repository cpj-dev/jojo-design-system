<!-- @dsCard group="Marketing" viewport="1280x720" name="Marketing site" subtitle="Nav, hero, features, pricing, footer — light/dark toggle, composed from DS primitives" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>jojo — warm paper, drawn in ink</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>window.DS = window.JojoDesignSystem || {};</script>
<style>
  /* ---- shell: content shares one max-width + inset everywhere ---- */
  .mk-shell { max-width: var(--view-max); margin: 0 auto; padding-inline: clamp(20px, 4vw, 28px); }

  /* ---- nav ---- */
  .mk-nav { position: sticky; top: 0; z-index: 40; background: var(--bg-app); border-bottom: 1px solid var(--hairline); }
  .mk-nav__row { display: flex; align-items: center; gap: 22px; height: 60px; }
  .mk-logo { display: inline-flex; align-items: center; gap: 9px; color: var(--fg-1); font-size: 18px; font-weight: 500; letter-spacing: -0.4px; }
  .mk-nav__links { display: flex; align-items: center; gap: 22px; margin-left: 10px; flex: 1; }
  .mk-nav__links a { font-size: 14px; color: var(--fg-2); }
  .mk-nav__links a:hover { color: var(--fg-1); }
  .mk-nav__links a.is-active { color: var(--accent-orange); }
  .mk-nav__actions { display: flex; align-items: center; gap: 10px; }

  .mk-eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em; color: var(--fg-2); }

  /* ---- hero ---- */
  .mk-hero { padding-block: clamp(40px, 7vw, 96px); }
  .mk-hero__inner { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: clamp(28px, 5vw, 64px); align-items: center; }
  .mk-hero__title { font-size: clamp(40px, 6.4vw, 72px); font-weight: 400; letter-spacing: -0.03em; line-height: 1.02; margin: 14px 0 0; }
  .mk-hero__sub { font-size: 18px; color: var(--fg-2); line-height: 1.55; max-width: 50ch; margin-top: 18px; }
  .mk-hero__cta { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 26px; }
  .mk-hero__meta { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); margin-top: 16px; }

  .mk-code { background: var(--bg-1); border: 1px solid var(--hairline); border-radius: var(--radius-trigger); overflow: hidden; }
  .mk-code__bar { padding: 9px 14px; border-bottom: 1px solid var(--hairline); }
  .mk-code__file { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-2); }
  .mk-code__body { margin: 0; padding: 16px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.75; color: var(--fg-1); white-space: pre; overflow-x: auto; }
  .mk-code__body .c-com { color: var(--fg-2); }
  .mk-code__body .c-kw { color: var(--fg-1); font-weight: 500; }
  .mk-code__body .c-add { display: inline-block; width: 100%; background: var(--ok-tint); color: var(--ok); }
  .mk-code__hint { padding: 10px 14px; border-top: 1px solid var(--hairline); font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-2); display: flex; align-items: center; gap: 8px; }
  .mk-kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 6px; border: 1px solid var(--hairline); border-radius: var(--radius-inline); background: var(--bg-2); color: var(--fg-2); font-size: 11px; }

  /* ---- sections ---- */
  .mk-section { padding-block: clamp(48px, 8vw, 92px); border-top: 1px solid var(--hairline); }
  .mk-section__head { max-width: 62ch; }
  .mk-section__head--center { max-width: 56ch; margin: 0 auto; text-align: center; }
  .mk-section__title { font-size: clamp(28px, 4vw, 40px); font-weight: 400; letter-spacing: -0.02em; line-height: 1.08; margin: 12px 0 0; }
  .mk-section__lede { font-size: 16px; color: var(--fg-2); line-height: 1.6; margin-top: 16px; }

  /* features — grouped by gap, no boxes */
  .mk-feat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(26px, 3.5vw, 44px) clamp(24px, 3vw, 40px); margin-top: clamp(34px, 4vw, 56px); }
  .mk-feat__icon { color: var(--fg-1); }
  .mk-feat__icon svg { width: 22px; height: 22px; }
  .mk-feat__title { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; margin: 14px 0 0; }
  .mk-feat__body { font-size: 14px; color: var(--fg-2); line-height: 1.55; margin-top: 7px; }

  /* pricing */
  .mk-price__toggle { display: flex; justify-content: center; margin-top: 22px; }
  .mk-price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: clamp(30px, 3.5vw, 48px); align-items: stretch; }
  .mk-price { display: flex; flex-direction: column; }
  .mk-price__head { display: flex; align-items: center; justify-content: space-between; min-height: 24px; }
  .mk-price__name { font-size: 15px; font-weight: 500; }
  .mk-price__flag { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-1); background: var(--bg-3); border: 1px solid var(--hairline); border-radius: var(--radius-pill); padding: 2px 9px; }
  .mk-price__amount { display: flex; align-items: baseline; gap: 7px; margin-top: 16px; }
  .mk-price__num { font-size: 42px; font-weight: 400; letter-spacing: -0.03em; line-height: 1; }
  .mk-price__per { font-size: 13px; color: var(--fg-2); }
  .mk-price__blurb { font-size: 13px; color: var(--fg-2); margin-top: 10px; min-height: 36px; }
  .mk-price__cta { width: 100%; margin: 16px 0 18px; }
  .mk-price__list { list-style: none; margin: 0; padding: 16px 0 0; border-top: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 10px; }
  .mk-price__list li { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; color: var(--fg-1); }
  .mk-price__check { color: var(--fg-1); flex: 0 0 auto; margin-top: 1px; }

  /* footer */
  .mk-cta { text-align: center; padding-block: clamp(48px, 7vw, 88px); border-top: 1px solid var(--hairline); }
  .mk-cta__title { font-size: clamp(28px, 4.4vw, 44px); font-weight: 400; letter-spacing: -0.025em; }
  .mk-cta__actions { display: flex; justify-content: center; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 24px; }
  .mk-footer { background: var(--bg-app); }
  .mk-footer__grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 28px; padding-top: 40px; border-top: 1px solid var(--hairline); }
  .mk-footer__brand .mk-logo { font-size: 17px; }
  .mk-footer__tag { font-size: 13px; color: var(--fg-2); margin-top: 12px; }
  .mk-footer__col { display: flex; flex-direction: column; gap: 9px; }
  .mk-footer__h { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
  .mk-footer__col a { font-size: 13px; color: var(--fg-2); }
  .mk-footer__col a:hover { color: var(--fg-1); }
  .mk-footer__bar { display: flex; align-items: center; justify-content: space-between; padding: 22px 0 34px; margin-top: 34px; border-top: 1px solid var(--hairline); font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-2); }
  .mk-footer__legal { display: flex; gap: 16px; }
  .mk-footer__legal a:hover { color: var(--fg-1); }

  @media (max-width: 860px) {
    .mk-hero__inner { grid-template-columns: 1fr; }
    .mk-feat-grid { grid-template-columns: repeat(2, 1fr); }
    .mk-price-grid { grid-template-columns: 1fr; }
    .mk-footer__grid { grid-template-columns: 1fr 1fr; }
    .mk-nav__links { display: none; }
  }
  @media (max-width: 520px) {
    .mk-feat-grid { grid-template-columns: 1fr; }
    .mk-hide-sm { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Features.jsx"></script>
<script type="text/babel" src="Pricing.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
  const { useState, useEffect } = React;
  function App() {
    const [theme, setTheme] = useState(() => {
      try { return localStorage.getItem('jojo-mk-theme') || 'light'; } catch (e) { return 'light'; }
    });
    useEffect(() => {
      document.documentElement.classList.toggle('dark', theme === 'dark');
      try { localStorage.setItem('jojo-mk-theme', theme); } catch (e) {}
    }, [theme]);
    useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

    return (
      <React.Fragment>
        <Nav theme={theme} onToggleTheme={() => setTheme((t) => (t === 'dark' ? 'light' : 'dark'))} />
        <main>
          <Hero />
          <Features />
          <Pricing />
        </main>
        <Footer />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
